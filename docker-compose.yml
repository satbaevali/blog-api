services:

  # ---------------------------------------------------------------------------
  # Redis — broker, cache, channel layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: blog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Web — Django ASGI server via Daphne
  # Required for WebSockets + async views
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_web
    ports:
      - "8000:8000"
    env_file:
      - backend/settings/.env
    environment:
      - BLOG_ENV_ID=prod
    volumes:
      - sqlite_data:/app/backend
      - static_data:/app/backend/static
      - media_data:/app/backend/media
    depends_on:
      redis:
        condition: service_healthy
    command: >
      daphne -b 0.0.0.0 -p 8000 settings.asgi:application

  # ---------------------------------------------------------------------------
  # Celery Worker — processes async tasks
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_celery_worker
    env_file:
      - backend/settings/.env
    environment:
      - BLOG_ENV_ID=prod
    volumes:
      - sqlite_data:/app/backend
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A settings worker -l info

  # ---------------------------------------------------------------------------
  # Celery Beat — runs scheduled tasks
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_celery_beat
    env_file:
      - backend/settings/.env
    environment:
      - BLOG_ENV_ID=prod
    volumes:
      - sqlite_data:/app/backend
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A settings beat -l info

  # ---------------------------------------------------------------------------
  # Flower — Celery monitoring dashboard
  # Accessible at http://localhost:5555
  # Protected by basic auth (BLOG_FLOWER_USER / BLOG_FLOWER_PASSWORD)
  # ---------------------------------------------------------------------------
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_flower
    ports:
      - "5555:5555"
    env_file:
      - backend/settings/.env
    environment:
      - BLOG_ENV_ID=prod
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A settings flower
      --basic_auth=${BLOG_FLOWER_USER}:${BLOG_FLOWER_PASSWORD}
      --port=5555

volumes:
  redis_data:
  sqlite_data:
  static_data:
  media_data: